name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Cache binary vcpkg vào GitHub Actions cache.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      # Thiết lập môi trường MSVC (cl.exe/link.exe) để Ninja KHÔNG chọn nhầm
      # MinGW gcc — vcpkg build lib bằng MSVC nên phải link bằng MSVC.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      # Cho phép vcpkg ghi/đọc GitHub Actions cache.
      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure (CMake preset)
        shell: pwsh
        run: cmake --preset x64-release -D ETWC_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build --preset x64-release

      - name: Test
        shell: pwsh
        run: ctest --preset x64-release --output-on-failure
        # Lưu ý: test tích hợp cần quyền admin/ETW sẽ được tách nhãn riêng.

  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.hpp -Path src,include,tests
          if ($files) {
            clang-format --dry-run --Werror @($files.FullName)
          }

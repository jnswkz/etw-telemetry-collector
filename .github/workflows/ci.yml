name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Thiết lập môi trường MSVC (cl.exe/link.exe) để Ninja KHÔNG chọn nhầm
      # MinGW gcc — vcpkg build lib bằng MSVC nên phải link bằng MSVC.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Ninja không chắc có sẵn trên PATH -> cài rõ ràng.
      - name: Setup Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      # Clone vcpkg ĐẦY ĐỦ (không shallow) để có commit baseline trong lịch sử,
      # rồi ép VCPKG_ROOT (sau msvc-dev-cmd để thắng giá trị nó có thể đã đặt).
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}/vcpkg"
          git clone https://github.com/microsoft/vcpkg $root
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure (CMake preset)
        shell: pwsh
        run: cmake --preset x64-release -D ETWC_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build --preset x64-release

      - name: Test
        shell: pwsh
        run: ctest --preset x64-release --output-on-failure
        # Lưu ý: test tích hợp cần quyền admin/ETW sẽ được tách nhãn riêng.

  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.hpp -Path src,include,tests
          if ($files) {
            clang-format --dry-run --Werror @($files.FullName)
          }

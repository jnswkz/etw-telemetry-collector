name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Thiết lập môi trường MSVC (cl.exe/link.exe) để Ninja KHÔNG chọn nhầm
      # MinGW gcc — vcpkg build lib bằng MSVC nên phải link bằng MSVC.
      # Lưu ý: bước này có thể tự set VCPKG_ROOT sang vcpkg bundled của VS,
      # nên ta ghi đè VCPKG_ROOT ở bước sau (sau bước này để thắng).
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Dùng vcpkg cài sẵn trên runner (C:\vcpkg); ép VCPKG_ROOT ghi đè giá trị
      # mà msvc-dev-cmd có thể đã đặt.
      - name: Set VCPKG_ROOT to runner vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Configure (CMake preset)
        shell: pwsh
        run: cmake --preset x64-release -D ETWC_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build --preset x64-release

      - name: Test
        shell: pwsh
        run: ctest --preset x64-release --output-on-failure
        # Lưu ý: test tích hợp cần quyền admin/ETW sẽ được tách nhãn riêng.

  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.hpp -Path src,include,tests
          if ($files) {
            clang-format --dry-run --Werror @($files.FullName)
          }
